name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    name: Build, sign & publish
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Releases are published to THIS repository, which is public since 1.7.3.
      # The updater downloads latest.json and the installer anonymously, so the
      # hosting repository must stay public: if it is ever made private again,
      # release assets answer 404 and every client silently stops updating.
      #
      # Required repository secrets (see docs/RELEASE.md):
      #   TAURI_SIGNING_PRIVATE_KEY          contents of nimbus.key
      #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD its password
      #   RELEASES_TOKEN                     PAT with contents:write on the
      #                                      legacy repo, used by the mirror step
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nimbus Client ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          releaseBody: |
            **Nimbus Client 1.7.7**

            • Полная интеграция Ely.by и предпросмотр скинов.
            • Новая расширенная палитра классических цветов и более 20 уникальных градиентных акцентов.
            • Улучшенный менеджер аккаунтов.
            • Автоматическая и фоновая проверка обновлений клиента.

      # Builds up to and including 1.7.2 have the OLD endpoint compiled in and
      # keep polling coddyxdev/Nimbus-Launcher-releases. Mirroring latest.json
      # there keeps them updating. The manifest points at the installer in this
      # repository, so only the manifest is copied, never the binaries.
      #
      # When nobody is left on <= 1.7.2, delete both steps below and archive the
      # legacy repository.
      - name: Download published manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
        run: gh release download $env:TAG --repo $env:SOURCE_REPO --pattern latest.json --dir mirror

      - name: Mirror manifest to the legacy releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAG: ${{ github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          $repo = 'coddyxdev/Nimbus-Launcher-releases'
          $tag = $env:TAG
          $link = 'https://github.com/' + $env:SOURCE_REPO + '/releases/tag/' + $tag
          $notes = 'Зеркало манифеста обновлений для сборок 1.7.2 и старше. Установщик лежит в основном репозитории: ' + $link
          gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --target main --title "Nimbus Client $tag" --notes $notes
          }
          gh release upload $tag mirror/latest.json --repo $repo --clobber
